  scheduler-health:
    desc: "Print background scheduler health analytics"
    cmds:
      - npm run scheduler-health

  scheduler-report:
    desc: "Generate daily and weekly scheduler performance reports"
    cmds:
      - npm run scheduler-report




  narrator-sources:
    desc: "Scan approved files and generate narrator source snapshot"
    cmds:
      - npm run narrator-sources

  narrator-validate:
    desc: "Validate narrator_card.json output"
    cmds:
