version: '3'

tasks:
  init:
    desc: "Install dependencies"
    cmds:
      - npm install

  build:
    desc: "Compile TypeScript sources"
    cmds:
      - npm run build

  audit:
    desc: "Run self-audit checks"
    cmds:
      - npm run audit

  brief:
    desc: "Generate operational brief"
    cmds:
      - npm run brief

  next:
    desc: "Print ranked next actions"
    cmds:
      - npm run next

  ingest:
    desc: "Ingest local Obsidian vaults in read-only mode"
    cmds:
      - npm run ingest

  sync-status:
    desc: "Sync local statuses and append Obsidian intelligence snapshot"
    cmds:
      - npm run sync-status

  daily-brief:
    desc: "Generate daily operational operating brief"
    cmds:
      - npm run daily-brief

  agents:
    desc: "Print active productivity agents"
    cmds:
      - npm run agents

  stage-write:
    desc: "Stage Markdown reports in write_staging output folder"
    cmds:
      - npm run stage-write

  approve-write:
    desc: "Approve and execute safe write into Obsidian vault briefs folder"
    cmds:
      - npm run approve-write

  write-log:
    desc: "Print approved write logs history"
    cmds:
      - npm run write-log

  command:
    desc: "Execute a registered CLI command safely"
    cmds:
      - npm run command -- {{.CLI_ARGS}}

  command-help:
    desc: "Print all registered CLI commands"
    cmds:
      - npm run command-help

  campaign:
    desc: "Run campaign template actions safely"
    cmds:
      - npm run campaign -- {{.CLI_ARGS}}

  campaign-help:
    desc: "Print campaign CLI help"
    cmds:
      - npm run campaign-help

  voice-queue:
    desc: "Process text-based voice commands queue safely"
    cmds:
      - npm run voice-queue

  voice-help:
    desc: "Print voice commands mapping table registry"
    cmds:
      - npm run voice-help

  voice-pending:
    desc: "List voice commands pending confirmation review"
    cmds:
      - npm run voice-pending

  voice-confirm:
    desc: "Approve and execute a pending voice command"
    cmds:
      - npm run voice-confirm -- {{.CLI_ARGS}}

  voice-deny:
    desc: "Deny and discard a pending voice command"
    cmds:
      - npm run voice-deny -- {{.CLI_ARGS}}

  vibevoice-help:
    desc: "Print VibeVoice transcript bridge safety menus"
    cmds:
      - npm run vibevoice-help

  vibevoice-transcript:
    desc: "Scan and ingest manual transcripts into queue inbox"
    cmds:
      - npm run vibevoice-transcript

  vibevoice-test:
    desc: "Generate sample test files under manual voice input"
    cmds:
      - npm run vibevoice-test

  live-asr-help:
    desc: "Print Live ASR safety menus and command flow"
    cmds:
      - npm run live-asr-help

  live-asr-record:
    desc: "Microphone recording interface info and staging parameters"
    cmds:
      - npm run live-asr-record

  live-asr-import:
    desc: "Import raw live transcripts from voice_input/live into manual staging"
    cmds:
      - npm run live-asr-import

  live-asr-test:
    desc: "Generate mock ASR transcript inputs under voice_input/live"
    cmds:
      - npm run live-asr-test

  campaign-scheduler-help:
    desc: "Print campaign scheduler available tasks and parameters"
    cmds:
      - npm run campaign-scheduler-help

  campaign-scheduler:
    desc: "Run campaign scheduler draft tasks (create, queue, log, status)"
    cmds:
      - npm run campaign-scheduler -- {{.CLI_ARGS}}

  campaign-simulate-help:
    desc: "Print campaign simulation available tasks and parameters"
    cmds:
      - npm run campaign-simulate-help

  campaign-simulate:
    desc: "Run campaign simulation audits (sporty, validate sporty, status sporty)"
    cmds:
      - npm run campaign-simulate -- {{.CLI_ARGS}}

  mesh-telemetry-help:
    desc: "Print mesh telemetry available tasks and parameters"
    cmds:
      - npm run mesh-telemetry-help

  mesh-telemetry:
    desc: "Run system mesh telemetry logging (snapshot, report, campaign sporty, status)"
    cmds:
      - npm run mesh-telemetry -- {{.CLI_ARGS}}

  dashboard-export:
    desc: "Export system statuses and telemetry metrics to dashboard JSON"
    cmds:
      - npm run dashboard:export

  dashboard-build:
    desc: "Compile the Vite dashboard production build"
    cmds:
      - npm run dashboard:build

  automation-help:
    desc: "Print all registered automation routines"
    cmds:
      - npm run automation-help

  automation-runner:
    desc: "Execute a pre-approved local automation routine"
    cmds:
      - npm run automation-runner -- {{.CLI_ARGS}}

  validate:
    desc: "Lint and run workspace checks"
    cmds:
      - npm run lint

  test:
    desc: "Run test suite"
    cmds:
      - npm run test

  voice:intent:
    desc: "Announce tactical intent via Voice Narrative Protocol"
    cmds:
      - bash /Users/alexanderanthony/.agents/voice_narrative.sh "{{.MSG}}"

  voice:done:
    desc: "Announce completion via Voice Narrative Protocol"
    cmds:
      - bash -c 'source /Users/alexanderanthony/.agents/voice_narrative.sh && announce_completion "{{.MSG}}" {{.SOVEREIGNTY_INC | default 10}}'
