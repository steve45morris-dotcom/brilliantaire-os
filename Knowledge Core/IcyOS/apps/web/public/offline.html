<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="theme-color" content="#09090b" />
  <title>Offline — IcyOS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #09090b;
      color: #fafafa;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 1.5rem;
    }
    .icon {
      width: 4rem; height: 4rem; border-radius: 1rem;
      background: #18181b; display: flex; align-items: center;
      justify-content: center; margin-bottom: 1.5rem;
    }
    h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 0.5rem; }
    p { color: #71717a; font-size: 0.875rem; text-align: center; max-width: 20rem; margin-bottom: 2rem; line-height: 1.5; }
    button {
      padding: 0.625rem 1.5rem; background: #f50057; color: #fff;
      font-size: 0.875rem; font-weight: 600; border: none;
      border-radius: 0.375rem; cursor: pointer; transition: background 0.15s;
    }
    button:hover { background: #d50048; }
  </style>
</head>
<body>
  <div class="icon">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#f50057" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="1" y1="1" x2="23" y2="23"/>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
      <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
      <line x1="12" y1="20" x2="12.01" y2="20"/>
    </svg>
  </div>
  <h1>You're Offline</h1>
  <p>IcyOS needs a network connection. Check your Wi-Fi or cellular data and try again.</p>
  <button onclick="location.reload()">Retry</button>
</body>
</html>
