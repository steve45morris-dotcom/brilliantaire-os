name: IcyOS Deploy

on:
  push:
    branches: [main]
    paths:
      - 'Knowledge Core/IcyOS/**'
      - '.github/workflows/icyos-deploy.yml'
  workflow_dispatch:

concurrency:
  group: icyos-deploy
  cancel-in-progress: false

defaults:
  run:
    working-directory: Knowledge Core/IcyOS

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      # Without the three Vercel secrets there is nothing to deploy to. Every
      # run used to fail at "Pull Vercel environment", which turned main red
      # over a setting and hid real failures behind it. Now the run says, once,
      # that IcyOS wasn't deployed and how to connect Vercel, and skips the
      # rest. With the secrets set, nothing below changes: a deploy that
      # fails still fails the run.
      - name: Check the Vercel secrets
        id: vercel
        working-directory: ${{ github.workspace }}
        env:
          HAS_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          HAS_ORG: ${{ secrets.VERCEL_ORG_ID != '' }}
          HAS_PROJECT: ${{ secrets.VERCEL_PROJECT_ID != '' }}
        run: |
          missing=""
          [ "$HAS_TOKEN" = "true" ] || missing="$missing VERCEL_TOKEN"
          [ "$HAS_ORG" = "true" ] || missing="$missing VERCEL_ORG_ID"
          [ "$HAS_PROJECT" = "true" ] || missing="$missing VERCEL_PROJECT_ID"
          missing="${missing# }"
          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "::warning title=IcyOS wasn't deployed::Vercel isn't connected: ${missing// /, } not set. Add them in Settings > Secrets and variables > Actions (see Knowledge Core/IcyOS/DEPLOY.md)."
          {
            echo "### IcyOS wasn't deployed"
            echo
            echo "Vercel isn't connected yet, so there was nothing to deploy to. Missing: \`${missing// /\`, \`}\`."
            echo
            echo "Add them in **Settings → Secrets and variables → Actions → New repository secret**:"
            echo
            echo "| Secret | Where to find it |"
            echo "|---|---|"
            echo "| \`VERCEL_TOKEN\` | Vercel → Settings → Tokens → Create |"
            echo "| \`VERCEL_ORG_ID\` | Vercel → team Settings → General → Team ID |"
            echo "| \`VERCEL_PROJECT_ID\` | Vercel → the project → Settings → General → Project ID |"
            echo
            echo "Once they're set, the next IcyOS change merged to main deploys, or run this workflow by hand: Actions → IcyOS Deploy → Run workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        if: steps.vercel.outputs.ready == 'true'

      - uses: pnpm/action-setup@v6
        if: steps.vercel.outputs.ready == 'true'
        with:
          version: 10

      - uses: actions/setup-node@v7
        if: steps.vercel.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Knowledge Core/IcyOS/pnpm-lock.yaml

      # Pinned so a deploy doesn't change with whatever CLI was published that
      # day. 63.1.2 is the version the Root Directory setup below was checked with.
      - name: Install Vercel CLI
        if: steps.vercel.outputs.ready == 'true'
        run: pnpm add -g vercel@63.1.2

      # The Vercel project's Root Directory is Knowledge Core/IcyOS/apps/web,
      # set from the repository root, so the Vercel CLI runs from the root too.
      # Run from Knowledge Core/IcyOS it joins the two and looks for
      # Knowledge Core/IcyOS/Knowledge Core/IcyOS/apps/web, which fails.
      # The CLI reads the token from VERCEL_TOKEN, given only to the two steps
      # that call it, never as --token, which would put it on the command line.
      - name: Pull Vercel environment
        if: steps.vercel.outputs.ready == 'true'
        working-directory: ${{ github.workspace }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production

      # Build on Vercel, not here. `vercel build` writes the function under the
      # Root Directory path, and "Knowledge Core" contains a space, which
      # `vercel deploy --prebuilt` rejects:
      #   A Serverless Function has an invalid name ... must not contain any space
      # A server-side build does not carry that path into the function name.

      - name: Deploy
        if: steps.vercel.outputs.ready == 'true'
        working-directory: ${{ github.workspace }}
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # --skip-domain: stage production without taking the public alias.
          # Promote with `vercel promote <url>` after acceptance.
          URL=$(vercel deploy --prod --skip-domain)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Deployed to production" >> "$GITHUB_STEP_SUMMARY"
          echo "[$URL]($URL)" >> "$GITHUB_STEP_SUMMARY"
